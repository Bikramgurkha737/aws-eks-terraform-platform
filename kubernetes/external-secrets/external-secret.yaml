apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-app-secret
  namespace: default
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: sample-app-secret
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: sample-app/example
        property: username

    - secretKey: password
      remoteRef:
        key: sample-app/example
        property: password
