mode: deployment

image:
  repository: otel/opentelemetry-collector-k8s

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 100

    batch:
      timeout: 5s
      send_batch_size: 1024

    resource:
      attributes:
        - key: deployment.environment
          value: portfolio
          action: upsert

  exporters:
    debug:
      verbosity: basic

  service:
    telemetry:
      logs:
        level: info

    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - resource
          - batch
        exporters:
          - debug

      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - resource
          - batch
        exporters:
          - debug