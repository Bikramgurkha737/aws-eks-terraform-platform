name: Kyverno Policy CI

on:
  pull_request:
    paths:
      - "kubernetes/kyverno/**"
      - "kubernetes/sample-app/**"
      - ".github/workflows/kyverno-ci.yml"

  push:
    branches:
      - main
    paths:
      - "kubernetes/kyverno/**"
      - "kubernetes/sample-app/**"
      - ".github/workflows/kyverno-ci.yml"

jobs:
  validate:
    name: Validate Kyverno Policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate policy YAML
        run: |
          ruby -e 'require "yaml"; Dir["kubernetes/kyverno/policies/*.yaml"].each { |f| YAML.load_stream(File.read(f)); puts "#{f} valid" }'

      - name: Install Kyverno CLI
        run: |
          curl -sL https://github.com/kyverno/kyverno/releases/latest/download/kyverno-cli_v1.15.0_linux_x86_64.tar.gz -o /tmp/kyverno.tar.gz
          tar -xzf /tmp/kyverno.tar.gz -C /tmp
          sudo mv /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Evaluate sample app against policies
        run: |
          kyverno apply kubernetes/kyverno/policies \
            --resource kubernetes/sample-app/deployment.yaml
