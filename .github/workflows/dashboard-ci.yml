name: Dashboard CI

on:
  push:
    branches:
      - main
    paths:
      - "monitoring/dashboards/**"
      - "monitoring/kube-prometheus-stack/**"
      - ".github/workflows/dashboard-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "monitoring/dashboards/**"
      - "monitoring/kube-prometheus-stack/**"
      - ".github/workflows/dashboard-ci.yml"

jobs:
  dashboard:
    name: Validate Grafana Dashboards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Install Kubeconform
        run: |
          curl -L \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate Dashboard JSON
        run: |
          python3 -m json.tool \
            monitoring/dashboards/sre-platform-overview.json \
            > /dev/null

      - name: Validate Dashboard ConfigMap
        run: |
          kubeconform \
            -strict \
            -summary \
            monitoring/dashboards/sre-platform-overview-configmap.yaml

      - name: Add Prometheus Community Helm repository
        run: |
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Render Monitoring Stack
        run: |
          helm template monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            -f monitoring/kube-prometheus-stack/values.yaml \
            > /tmp/monitoring-rendered.yaml

      - name: Validate Monitoring Stack
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /tmp/monitoring-rendered.yaml

      - name: Verify Grafana Dashboard Sidecar
        run: |
          grep -q "grafana_dashboard" /tmp/monitoring-rendered.yaml