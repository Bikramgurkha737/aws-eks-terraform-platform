name: External Secrets CI

on:
  pull_request:
    paths:
      - "terraform/modules/external-secrets-irsa/**"
      - "terraform/environments/**"
      - "kubernetes/external-secrets/**"
      - ".github/workflows/external-secrets-ci.yml"

  push:
    branches:
      - main
    paths:
      - "terraform/modules/external-secrets-irsa/**"
      - "terraform/environments/**"
      - "kubernetes/external-secrets/**"
      - ".github/workflows/external-secrets-ci.yml"

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate dev
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate staging
        working-directory: terraform/environments/staging
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate prod
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

  helm:
    name: External Secrets Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Add External Secrets Helm repository
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update

      - name: Render External Secrets manifests
        run: |
          helm template external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            -f kubernetes/external-secrets/values.yaml \
            --set-string serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="arn:aws:iam::123456789012:role/external-secrets-ci" \
            > /tmp/external-secrets-rendered.yaml

      - name: Verify IRSA annotation
        run: |
          grep -q \
            "eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/external-secrets-ci" \
            /tmp/external-secrets-rendered.yaml

      - name: Validate External Secrets YAML
        run: |
          ruby -e 'require "yaml"; Dir["kubernetes/external-secrets/*.yaml"].each { |f| YAML.load_stream(File.read(f)); puts "#{f} valid" }'
